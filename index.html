<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="shortcut icon" href="assets/images/favicon.png" type="image/png">
  <title>AniLog</title>
</head>

<body>
  <div class="wrapper">
    <section class="anime-list">
      <form class="anime-list__toolbar">
        <input class="anime-list__search" type="text" name="q" placeholder="Find a anime..." autocomplete="off">
        <details class="anime-list__filter">
          <summary class="anime-list__filter-summary">Status</summary>
          <div class="anime-list__filter-options">
            <label>
              <input class="anime-list__filter-option" type="radio" name="status" value="all" checked>
              All
            </label>
            <label>
              <input class="anime-list__filter-option" type="radio" name="status" value="watching">
              Watching
            </label>
            <label>
              <input class="anime-list__filter-option" type="radio" name="status" value="completed">
              Completed
            </label>
          </div>
        </details>
        <details class="anime-list__filter">
          <summary class="anime-list__filter-summary">Year</summary>
          <div class="anime-list__filter-options">
            <label>
              <input class="anime-list__filter-option" type="radio" name="status" value="all" checked>
              2025
            </label>
            <label>
              <input class="anime-list__filter-option" type="radio" name="status" value="watching">
              2025
            </label>
            <label>
              <input class="anime-list__filter-option" type="radio" name="status" value="completed">
              2025
            </label>
          </div>
        </details>
        <details class="anime-list__filter">
          <summary class="anime-list__filter-summary">Season</summary>
          <div class="anime-list__filter-options">
            <label>
              <input class="anime-list__filter-option" type="radio" name="status" value="all" checked>
              Winter
            </label>
            <label>
              <input class="anime-list__filter-option" type="radio" name="status" value="all">
              Spring
            </label>
            <label>
              <input class="anime-list__filter-option" type="radio" name="status" value="watching">
              Summer
            </label>
            <label>
              <input class="anime-list__filter-option" type="radio" name="status" value="completed">
              Fall
            </label>
          </div>
        </details>
        <details class="anime-list__filter">
          <summary class="anime-list__filter-summary">Sort</summary>
          <div class="anime-list__filter-options">
            <label>
              <input class="anime-list__filter-option" type="radio" name="status" value="all" checked>
              Season
            </label>
            <label>
              <input class="anime-list__filter-option" type="radio" name="status" value="all">
              Title
            </label>
          </div>
        </details>
        <button class="anime-list__new-button">New</button>
      </form>
    </section>
  </div>
  <script src="assets/js/script.js" defer></script>
</body>

</html>
